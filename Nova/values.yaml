cfg:
  image:
    registry: registry.platwo.com
    image: nova/nova-cfg
    tag: latest
    imagePullPolicy: Always
  replicas: 1
  service:
    type: ClusterIP
    port: 80
    targetPort: 8080
  env:
    - name: REDIS_URL
      value: ""
    - name: MIMIR_URL
      value: "https://mimir.domain.com/api/v1/push"
    - name: LOKI_URL
      value: "https://loki.domain.com/loki/api/v1/push"

postgres:
  name: nova-db
  database: nova
  owner: nova
  credentials:
    secretName: nova-db-app
  certManager:
    enabled: true
    clusterDomain: cluster.local
    duration: 2160h
    renewBefore: 360h
    privateKey:
      algorithm: ECDSA
      size: 256
    serverDNSNames: []

ui:
  image:
    registry: registry.platwo.com
    image: nova/nova-ui
    tag: latest
    imagePullPolicy: Always
  postgresWait:
    enabled: true
    timeoutSeconds: 300
    intervalSeconds: 2
  replicas: 1
  service:
    type: ClusterIP
    port: 80
    targetPort: 8000
  env:
    - name: NOVA_ENV
      value: "production"
    - name: DEBUG
      value: "false"
    - name: SECRET_KEY
      value: ""
    - name: ALLOWED_HOSTS
      value: ""
    - name: CSRF_TRUSTED_ORIGINS
      value: ""
    - name: DATABASE_URL
      value: ""
    - name: REDIS_URL
      value: ""
    - name: CONFIGURATION_URL
      value: ""
    - name: UI_URL
      value: ""
    - name: GRAFANA_PROTOCOL
      value: "http"
    - name: GRAFANA_HOST
      value: "nova-grafana-service.nova.svc.cluster.local:3000"
    - name: GRAFANA_EXTERNAL_URL
      value: "https://grafana.domain.com"
    - name: GRAFANA_USER
      valueFrom:
        secretKeyRef:
          name: grafana-admin-credentials
          key: GF_SECURITY_ADMIN_USER
    - name: GRAFANA_PASSWORD
      valueFrom:
        secretKeyRef:
          name: grafana-admin-credentials
          key: GF_SECURITY_ADMIN_PASSWORD
    - name: GRAFANA_OAUTH_CLIENT_ID
      value: ""
    - name: GRAFANA_OAUTH_CLIENT_SECRET
      value: ""
    - name: NOVA_PUBLIC_URL
      value: ""
    - name: NOVA_OIDC_ISSUER_URL
      value: ""
    - name: NODE_TOKEN_TTL_MINUTES
      value: "10"
    - name: DASHBOARD_WEBSOCKET_REFRESH_SECONDS
      value: "5"
    - name: CELERY_BROKER_URL
      value: ""
    - name: CELERY_BACKEND
      value: ""
    - name: EMAIL_HOST
      value: "localhost"
    - name: EMAIL_PORT
      value: "1025"
    - name: DEFAULT_FROM_EMAIL
      value: "Nova <noreply@nova.proxima-technologies.com>"
    - name: GITOPS_REPO_PATH
      value: ""
    - name: GITOPS_MANIFEST_ROOT
      value: "novaui"
    - name: GITOPS_AUTO_COMMIT
      value: "false"
    - name: GITOPS_AUTO_PUSH
      value: "false"
    - name: GITOPS_COMMIT_AUTHOR_NAME
      value: "NovaUI"
    - name: GITOPS_COMMIT_AUTHOR_EMAIL
      value: "novaui@localhost"
    - name: GITOPS_PLUGINS
      value: "config.gitops.plugins.grafana.GrafanaOperatorPlugin,config.gitops.plugins.apisix.APISIXPlugin"
    - name: GITOPS_GRAFANA_NAMESPACE
      value: "monitoring"
    - name: GITOPS_GRAFANA_INSTANCE_LABEL_KEY
      value: "dashboards"
    - name: GITOPS_GRAFANA_ADMIN_SECRET_NAME
      value: "grafana-admin-credentials"
    - name: GITOPS_GRAFANA_ADMIN_USER_KEY
      value: "GF_SECURITY_ADMIN_USER"
    - name: GITOPS_GRAFANA_ADMIN_PASSWORD_KEY
      value: "GF_SECURITY_ADMIN_PASSWORD"
    - name: GITOPS_GRAFANA_RESYNC_PERIOD
      value: "10m"
    - name: GITOPS_MIMIR_DATASOURCE_URL
      value: "http://mimir-gateway.mimir.svc/prometheus"
    - name: GITOPS_LOKI_DATASOURCE_URL
      value: "http://loki-gateway.loki.svc"
    - name: GITOPS_APISIX_NAMESPACE
      value: "apisix"
    - name: GITOPS_APISIX_INGRESS_CLASS
      value: "apisix"
    - name: GITOPS_APISIX_CONFIG_PLUGIN_CONFIG_NAME
      value: "nova-config-auth"
    - name: GITOPS_APISIX_MIMIR_PLUGIN_CONFIG_NAME
      value: "nova-mimir-auth"
    - name: GITOPS_APISIX_LOKI_PLUGIN_CONFIG_NAME
      value: "nova-loki-auth"

workers:
  enabled: true
  replicas: 1
  args:
    - celery
    - "-A"
    - NovaUI
    - worker
    - "-l"
    - INFO
    - "-B"
  resources: {}

grafana:
  server:
    url: "https://grafana.domain.com"
  config: {}
  database:
    enabled: true
    name: grafana-db
    instances: 1
    database: grafana
    owner: grafana
    sslMode: verify-full
    caMountPath: /etc/grafana/database
    credentials:
      secretName: grafana-db-credentials
      username: grafana
      password: "CHANGEME-grafana-db-password"
    storage:
      size: 1Gi
      storageClass: standard
    resources:
      requests:
        memory: "256Mi"
        cpu: "250m"
      limits:
        memory: "512Mi"
        cpu: "500m"
    certManager:
      enabled: true
      clusterDomain: cluster.local
      duration: 2160h
      renewBefore: 360h
      privateKey:
        algorithm: ECDSA
        size: 256
      serverDNSNames: []

apisixRoute:
  enabled: true
  ingressClassName: apisix
  tls:
    enabled: true
    secretName: "domain-com-wildcard-tls"
    secretNamespace: "cert-manager"
  ui:
    enabled: true
    host: "nova.domain.com"
    tls:
      enabled: true
    paths:
      - "/*"
    websocket:
      enabled: true
      paths:
        - "/ws/*"
      priority: 10
  cfg:
    enabled: true
    host: "cfg.domain.com"
    tls:
      enabled: true
    paths:
      - "/*"
    pluginConfig:
      name: "nova-config-auth"
      namespace: "apisix"
  mimir:
    enabled: true
    host: "mimir.domain.com"
    tls:
      enabled: true
    paths:
      - "/api/v1/push"
    serviceName: "nova-mimir-gateway"
    servicePort: 80
    externalName: "mimir-gateway.mimir.svc.cluster.local"
    pluginConfig:
      name: "nova-mimir-auth"
      namespace: "apisix"
  loki:
    enabled: true
    host: "loki.domain.com"
    tls:
      enabled: true
    paths:
      - "/loki/api/v1/push"
    serviceName: "nova-loki-gateway"
    servicePort: 80
    externalName: "loki-gateway.loki.svc.cluster.local"
    pluginConfig:
      name: "nova-loki-auth"
      namespace: "apisix"
  grafana:
    enabled: true
    host: "grafana.domain.com"
    tls:
      enabled: true
    paths:
      - "/*"
    serviceName: "nova-grafana-service"
    servicePort: 3000
dragonfly:
  auth:
    enabled: true
    secretName: dragonfly-auth
    secretKey: password
    password: "CHANGEME-strong-random"
  tls:
    enabled: true
    secretName: dragonfly-tls
    issuerName: dragonfly-selfsigned
    clusterDomain: cluster.local
    duration: 2160h
    renewBefore: 360h
    privateKey:
      algorithm: RSA
      size: 2048
    dnsNames: []
  storageClass: "standard"
  storage: "1Gi"
  replicas: 3
  resources:
    requests:
      cpu: "2"
      memory: "16Gi"
    limits:
      cpu: "6"
      memory: "32Gi"
  scheduling:
    enabled: false
    nodeSelector:
      nodepool: apps
    tolerations:
      - key: "workload"
        operator: "Equal"
        value: "stateful"
        effect: "NoSchedule"
    affinity:
      podAntiAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app.kubernetes.io/instance: dragonfly-ha
              topologyKey: "kubernetes.io/hostname"
    topologySpreadConstraints:
      - maxSkew: 1
        topologyKey: "topology.kubernetes.io/zone"
        whenUnsatisfiable: DoNotSchedule
        labelSelector:
          matchLabels:
            app.kubernetes.io/instance: dragonfly-ha
  s3:
    ACCESS_KEY_ID: "test"
    SECRET_KEY_ID: "test"
    ENDPOINT: "http://seaweedfs.nova.svc.cluster.local:8333"
