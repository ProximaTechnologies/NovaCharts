apiVersion: v1
kind: Service
metadata:
  name: "nova-cfg-{{ .Release.Name }}-service"
spec:
  type: {{ .Values.cfg.service.type }}
  selector:
    app: "nova-cfg-{{ .Release.Name }}"
  ports:
    - name: http
      protocol: TCP
      port: {{ .Values.cfg.service.port }}
      targetPort: {{ .Values.cfg.service.targetPort }}
