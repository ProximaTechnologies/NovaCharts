apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: nova-db
spec:
  instances: 3
  primaryUpdateStrategy: unsupervised

  postgresql:
    parameters:
      shared_buffers: "256MB"
      max_connections: "100"

  storage:
    size: 1Gi
    storageClass: standard

{{/*  backup:*/}}
{{/*    barmanObjectStore:*/}}
{{/*      destinationPath: s3://nova-backup/*/}}
{{/*      endpointURL: https://s3.amazonaws.com*/}}
{{/*      s3Credentials:*/}}
{{/*        accessKeyId:*/}}
{{/*          name: s3-creds*/}}
{{/*          key: ACCESS_KEY_ID*/}}
{{/*        secretAccessKey:*/}}
{{/*          name: s3-creds*/}}
{{/*          key: ACCESS_SECRET_KEY*/}}
{{/*    retentionPolicy: "30d"*/}}

  monitoring:
    enablePodMonitor: true

  resources:
    requests:
      memory: "512Mi"
      cpu: "500m"
    limits:
      memory: "1Gi"
      cpu: "1"

  affinity:
    enablePodAntiAffinity: true
    topologyKey: kubernetes.io/hostname
