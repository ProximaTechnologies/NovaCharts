apiVersion: apps/v1
kind: Deployment
metadata:
  name: "NovaCFG-{{.Release.Name}}-deployment"

spec:
  selector:
    matchLabels:
      app: "NovaCFG-{{.Release.Name}}"
  template:
    metadata:
      labels:
        app: "NovaCFG-{{.Release.Name}}"
    spec:
      containers:
        - name: "NovaCFG-{{.Release.Name}}"
          image: "{{ .Values.cfg.image.registry}}/{{.Values.cfg.image.image}}:{{.Values.cfg.image.tag}}"
          imagePullPolicy: {{.Values.cfg.image.imagePullPolicy}}
          ports:
            - containerPort: 8080
          {{- with .Values.cfg.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  replicas: {{.Values.cfg.replicas}}
