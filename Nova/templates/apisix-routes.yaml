{{- if and .Values.apisixRoute.enabled .Values.apisixRoute.ui.enabled }}
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: "nova-ui-{{ .Release.Name }}-route"
spec:
  ingressClassName: {{ .Values.apisixRoute.ingressClassName | default "apisix" | quote }}
  http:
    {{- if .Values.apisixRoute.ui.websocket.enabled }}
    - name: "nova-ui-{{ .Release.Name }}-websocket"
      priority: {{ .Values.apisixRoute.ui.websocket.priority }}
      match:
        hosts:
          - {{ .Values.apisixRoute.ui.host | quote }}
        paths:
          {{- toYaml .Values.apisixRoute.ui.websocket.paths | nindent 10 }}
      backends:
        - serviceName: "nova-ui-{{ .Release.Name }}-service"
          servicePort: {{ .Values.ui.service.port }}
      websocket: true
    {{- end }}
    - name: "nova-ui-{{ .Release.Name }}"
      match:
        hosts:
          - {{ .Values.apisixRoute.ui.host | quote }}
        paths:
          {{- toYaml .Values.apisixRoute.ui.paths | nindent 10 }}
      backends:
        - serviceName: "nova-ui-{{ .Release.Name }}-service"
          servicePort: {{ .Values.ui.service.port }}
{{- end }}
{{- if and .Values.apisixRoute.enabled .Values.apisixRoute.cfg.enabled }}
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: "nova-cfg-{{ .Release.Name }}-route"
spec:
  ingressClassName: {{ .Values.apisixRoute.ingressClassName | default "apisix" | quote }}
  http:
    - name: "nova-cfg-{{ .Release.Name }}"
      match:
        hosts:
          - {{ .Values.apisixRoute.cfg.host | quote }}
        paths:
          {{- toYaml .Values.apisixRoute.cfg.paths | nindent 10 }}
      backends:
        - serviceName: "nova-cfg-{{ .Release.Name }}-service"
          servicePort: {{ .Values.cfg.service.port }}
{{- end }}
{{- if and .Values.apisixRoute.enabled .Values.apisixRoute.grafana.enabled }}
---
apiVersion: apisix.apache.org/v2
kind: ApisixRoute
metadata:
  name: "nova-grafana-{{ .Release.Name }}-route"
spec:
  ingressClassName: {{ .Values.apisixRoute.ingressClassName | default "apisix" | quote }}
  http:
    - name: "nova-grafana-{{ .Release.Name }}"
      match:
        hosts:
          - {{ .Values.apisixRoute.grafana.host | quote }}
        paths:
          {{- toYaml .Values.apisixRoute.grafana.paths | nindent 10 }}
      backends:
        - serviceName: {{ .Values.apisixRoute.grafana.serviceName | quote }}
          servicePort: {{ .Values.apisixRoute.grafana.servicePort }}
{{- end }}
