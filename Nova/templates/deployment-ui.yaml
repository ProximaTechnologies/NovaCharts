apiVersion: apps/v1
kind: Deployment
metadata:
  name: "NovaUI-{{.Release.Name}}-deployment"
spec:
  selector:
    matchLabels:
      app: "NovaUI-{{.Release.Name}}"
  template:
    metadata:
      labels:
        app: "NovaUI-{{.Release.Name}}"
    spec:
      containers:
        - name: "NovaUI-{{.Release.Name}}"
          image: "{{ .Values.ui.image.registry}}/{{.Values.ui.image.image}}:{{.Values.ui.image.tag}}"
          imagePullPolicy: {{.Values.ui.image.imagePullPolicy}}
          ports:
            - containerPort: 8000
          {{- with .Values.ui.env }}
          env:
            {{- toYaml . | nindent 12 }}
          {{- end }}
  replicas: {{.Values.ui.replicas}}
