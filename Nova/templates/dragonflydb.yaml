{{- $dragonfly := .Values.dragonfly | default dict -}}
{{- $namespace := get $dragonfly "namespace" | default "dragonfly-prod" -}}
{{- $name := get $dragonfly "name" | default "dragonfly-ha" -}}
{{- $replicas := get $dragonfly "replicas" | default 3 -}}
{{- $image := get $dragonfly "image" | default "docker.dragonflydb.io/dragonflydb/dragonfly:v1.21.2" -}}
{{- $maxmemory := get $dragonfly "maxmemory" | default "24gb" -}}
{{- $hz := get $dragonfly "hz" | default 100 -}}

{{- $auth := get $dragonfly "auth" | default dict -}}
{{- $authEnabled := true -}}
{{- if hasKey $auth "enabled" -}}
{{- $authEnabled = $auth.enabled -}}
{{- end -}}
{{- $authSecretName := get $auth "secretName" | default "dragonfly-auth" -}}
{{- $authSecretKey := get $auth "secretKey" | default "password" -}}
{{- $authPassword := get $auth "password" | default "CHANGEME-strong-random" -}}

{{- $tls := get $dragonfly "tls" | default dict -}}
{{- $tlsEnabled := true -}}
{{- if hasKey $tls "enabled" -}}
{{- $tlsEnabled = $tls.enabled -}}
{{- end -}}
{{- $tlsSecretName := get $tls "secretName" | default "dragonfly-tls" -}}
{{- $tlsIssuerName := get $tls "issuerName" | default "dragonfly-selfsigned" -}}
{{- $tlsClusterDomain := get $tls "clusterDomain" | default "cluster.local" -}}
{{- $tlsDuration := get $tls "duration" | default "2160h" -}}
{{- $tlsRenewBefore := get $tls "renewBefore" | default "360h" -}}
{{- $tlsPrivateKey := get $tls "privateKey" | default dict -}}
{{- $tlsPrivateKeyAlgorithm := get $tlsPrivateKey "algorithm" | default "RSA" -}}
{{- $tlsPrivateKeySize := get $tlsPrivateKey "size" | default 2048 -}}

{{- $snapshot := get $dragonfly "snapshot" | default dict -}}
{{- $snapshotEnabled := true -}}
{{- if hasKey $snapshot "enabled" -}}
{{- $snapshotEnabled = $snapshot.enabled -}}
{{- end -}}
{{- $snapshotCron := get $snapshot "cron" | default "0 */6 * * *" -}}
{{- $snapshotDbFilename := get $snapshot "dbfilename" | default "dragonfly-cache" -}}
{{- $snapshotStorage := get $snapshot "storage" | default (get $dragonfly "storage" | default "100Gi") -}}
{{- $snapshotStorageClass := get $snapshot "storageClassName" | default (get $dragonfly "storageClass" | default "") -}}

# --- Namespace ---------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: {{ $namespace }}

{{- if $authEnabled }}
---
# --- Client auth secret ------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: {{ $authSecretName }}
  namespace: {{ $namespace }}
type: Opaque
stringData:
  {{ $authSecretKey }}: {{ $authPassword | quote }}
{{- end }}

{{- if $tlsEnabled }}
---
# --- TLS cert managed by cert-manager ---------------------------------------
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ $tlsIssuerName }}
  namespace: {{ $namespace }}
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ $tlsSecretName }}
  namespace: {{ $namespace }}
spec:
  secretName: {{ $tlsSecretName }}
  duration: {{ $tlsDuration | quote }}
  renewBefore: {{ $tlsRenewBefore | quote }}
  privateKey:
    algorithm: {{ $tlsPrivateKeyAlgorithm }}
    size: {{ $tlsPrivateKeySize }}
  usages:
    - server auth
  commonName: {{ $name }}.{{ $namespace }}.svc
  dnsNames:
    - {{ $name }}
    - {{ $name }}.{{ $namespace }}
    - {{ $name }}.{{ $namespace }}.svc
    - {{ $name }}.{{ $namespace }}.svc.{{ $tlsClusterDomain }}
    {{- with (get $tls "dnsNames") }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  issuerRef:
    name: {{ $tlsIssuerName }}
    kind: Issuer
{{- end }}

---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/instance: {{ $name }}
spec:
  replicas: {{ $replicas }}
  image: {{ $image | quote }}

  # Cache-oriented runtime args.
  # --dbfilename is important: it makes snapshots overwrite one rolling file
  # instead of accumulating timestamped snapshot files until the PVC fills up.
  args:
    - "--cluster_mode=emulated"
    - "--maxmemory={{ $maxmemory }}"
    - "--hz={{ $hz }}"
{{- if $snapshotEnabled }}
    - "--dbfilename={{ $snapshotDbFilename }}"
{{- end }}

{{- if $authEnabled }}
  authentication:
    passwordFromSecret:
      name: {{ $authSecretName }}
      key: {{ $authSecretKey }}
{{- end }}
{{- if $tlsEnabled }}
  tlsSecretRef:
    name: {{ $tlsSecretName }}
{{- end }}

{{- with (get $dragonfly "resources") }}
  resources:
    {{- toYaml . | nindent 4 }}
{{- end }}

{{- with (get $dragonfly "scheduling") }}
{{- if .enabled }}
{{- with .nodeSelector }}
  nodeSelector:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with .tolerations }}
  tolerations:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with .affinity }}
  affinity:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- with .topologySpreadConstraints }}
  topologySpreadConstraints:
    {{- toYaml . | nindent 4 }}
{{- end }}
{{- end }}
{{- end }}

  serviceSpec:
    type: ClusterIP
    annotations:
      prometheus.io/scrape: "true"

{{- if $snapshotEnabled }}
  # Warm-cache snapshot. This keeps one rolling snapshot because --dbfilename
  # is static. Do not use S3 backup wiring for disposable cache unless you
  # explicitly want durable cache backups.
  snapshot:
    cron: {{ $snapshotCron | quote }}
    persistentVolumeClaimSpec:
      accessModes: ["ReadWriteOnce"]
{{- if $snapshotStorageClass }}
      storageClassName: {{ $snapshotStorageClass | quote }}
{{- end }}
      resources:
        requests:
          storage: {{ $snapshotStorage | quote }}
{{- end }}

  labels:
    app: {{ $name }}

---
# --- Prometheus PodMonitor ---------------------------------------------------
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ $name }}
  namespace: {{ $namespace }}
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: {{ $name }}
  namespaceSelector:
    matchNames:
      - {{ $namespace }}
  podMetricsEndpoints:
    - port: admin
      interval: 15s
      scrapeTimeout: 10s

---
# --- NetworkPolicy -----------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $name }}-default-deny
  namespace: {{ $namespace }}
spec:
  podSelector:
    matchLabels:
      app: {{ $name }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector: {}
        - namespaceSelector:
            matchLabels:
              access.dragonflydb.io/allow: "true"
      ports:
        - port: 6379
          protocol: TCP
{{- if $tlsEnabled }}
        - port: 6380
          protocol: TCP
{{- end }}
    # Allow Prometheus scraping only from namespaces that are explicitly labeled.
    - from:
        - namespaceSelector:
            matchLabels:
              monitoring.dragonflydb.io/allow: "true"
      ports:
        - port: admin
  egress:
    # Allow Dragonfly pods to talk to same-namespace pods for operator-managed HA.
    - to:
        - podSelector: {}
    # Allow DNS. Narrow this to kube-dns/CoreDNS labels if your cluster standardizes them.
    - to:
        - namespaceSelector: {}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP