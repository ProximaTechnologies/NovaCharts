# --- Namespace (optional) -----------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: dragonfly-prod

---
# --- Client auth secret (password) -------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-auth
  namespace: dragonfly-prod
type: Opaque
stringData:
  password: "CHANGEME-strong-random"  # rotate via sealed-secrets/external secrets in real prod

---
# --- TLS cert managed by cert-manager ----------------------------------------
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: dragonfly-selfsigned
  namespace: dragonfly-prod
spec:
  selfSigned: {}

---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dragonfly-tls
  namespace: dragonfly-prod
spec:
  secretName: dragonfly-tls
  duration: 2160h # 90 days
  renewBefore: 360h # 15 days
  privateKey:
    algorithm: RSA
    size: 2048
  usages:
    - server auth
  commonName: dragonfly-ha.dragonfly-prod.svc
  dnsNames:
    - dragonfly-ha
    - dragonfly-ha.dragonfly-prod
    - dragonfly-ha.dragonfly-prod.svc
    - dragonfly-ha.dragonfly-prod.svc.cluster.local
  issuerRef:
    name: dragonfly-selfsigned
    kind: Issuer


---
apiVersion: v1
kind: Secret
metadata:
  name: dragonfly-s3-credentials
  namespace: dragonfly-prod
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ .Values.dragonfly.s3.ACCESS_KEY_ID | quote }}
  AWS_SECRET_ACCESS_KEY: {{ .Values.dragonfly.s3.SECRET_KEY_ID | quote }}
  AWS_ENDPOINT_URL: {{.Values.dragonfly.s3.ENDPOINT | quote}}
  AWS_REGION: "us-east-1"

---
apiVersion: dragonflydb.io/v1alpha1
kind: Dragonfly
metadata:
  name: dragonfly-ha
  namespace: dragonfly-prod
  labels:
    app.kubernetes.io/name: dragonfly
    app.kubernetes.io/instance: dragonfly-ha
spec:
  # 1 master + N-1 replicas; operator handles failover. :contentReference[oaicite:3]{index=3}
  replicas: {{.Values.dragonfly.replicas}}

  # Pin an explicit image tag to avoid surprise upgrades. (Example tag)
  image: "docker.dragonflydb.io/dragonflydb/dragonfly:v1.21.2"  # check latest before use. :contentReference[oaicite:4]{index=4}

  # Dragonfly runtime args (keep minimal & explicit)
  args:
    - "--cluster_mode=emulated"        # operator-managed HA topology
    - "--maxmemory=24gb"               # size to suit node capacity
    - "--hz=100"                       # tuning example; adjust to your SLOs

  # Auth (password) and TLS
  authentication:
    passwordFromSecret:
      name: dragonfly-auth
      key: password
  tlsSecretRef:
    name: dragonfly-tls

  # Resources (requests/limits) — tune to your nodes & workload
{{- with .Values.dragonfly.resources }}
  resources:
    {{- toYaml . | nindent 4 }}
{{- end }}

{{/*  # Scheduling for resilience*/}}
{{/*  nodeSelector:*/}}
{{/*    nodepool: apps*/}}
{{/*  tolerations:*/}}
{{/*    - key: "workload"*/}}
{{/*      operator: "Equal"*/}}
{{/*      value: "stateful"*/}}
{{/*      effect: "NoSchedule"*/}}
{{/*  affinity:*/}}
{{/*    podAntiAffinity:*/}}
{{/*      preferredDuringSchedulingIgnoredDuringExecution:*/}}
{{/*        - weight: 100*/}}
{{/*          podAffinityTerm:*/}}
{{/*            labelSelector:*/}}
{{/*              matchLabels:*/}}
{{/*                app.kubernetes.io/instance: dragonfly-ha*/}}
{{/*            topologyKey: "kubernetes.io/hostname"*/}}
{{/*  topologySpreadConstraints:*/}}
{{/*    - maxSkew: 1*/}}
{{/*      topologyKey: "topology.kubernetes.io/zone"*/}}
{{/*      whenUnsatisfiable: DoNotSchedule*/}}
{{/*      labelSelector:*/}}
{{/*        matchLabels:*/}}
{{/*          app.kubernetes.io/instance: dragonfly-ha*/}}

  # Service configuration (cluster-internal Redis endpoint)
  serviceSpec:
    type: ClusterIP
    annotations:
      # If you front this with an internal LB/Ingress, add your annotations here.
      prometheus.io/scrape: "true"   # harmless; PodMonitor is preferred

  snapshot:
    cron: "0 */1 * * *"               # hourly snapshot cadence
    dir: "s3://my-df-prod-backups"    # change to your bucket/path (or omit to use only PVC)
    persistentVolumeClaimSpec:
      accessModes: ["ReadWriteOnce"]
      storageClassName: {{.Values.dragonfly.storageClass}}
      resources:
        requests:
          storage: {{.Values.dragonfly.storage}}

  # Extra labels for selecting via PodMonitor/NetworkPolicy, etc.
  labels:
    app: dragonfly-ha

  env:
    - name: AWS_ACCESS_KEY_ID
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: AWS_ACCESS_KEY_ID

    - name: AWS_SECRET_ACCESS_KEY
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: AWS_SECRET_ACCESS_KEY

    - name: DFLY_s3_endpoint
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: AWS_ENDPOINT_URL

    - name: AWS_REGION
      valueFrom:
        secretKeyRef:
          name: dragonfly-s3-credentials
          key: AWS_REGION

---
# --- Prometheus PodMonitor (Prometheus Operator CRDs required) ----------------
# The operator exposes an 'admin' port that PodMonitor can scrape. :contentReference[oaicite:6]{index=6}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: dragonfly-ha
  namespace: dragonfly-prod
  labels:
    release: prometheus
spec:
  selector:
    matchLabels:
      app: dragonfly-ha   # must match spec.labels on Dragonfly pods. :contentReference[oaicite:7]{index=7}
  namespaceSelector:
    matchNames: ["dragonfly-prod"]
  podMetricsEndpoints:
    - port: admin
      interval: 15s
      scrapeTimeout: 10s

---
# --- NetworkPolicy: default deny + allow same-namespace + selected callers ----
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: dragonfly-ha-default-deny
  namespace: dragonfly-prod
spec:
  podSelector:
    matchLabels:
      app: dragonfly-ha
  policyTypes: ["Ingress","Egress"]
  ingress:
    - from:
        # Allow same-namespace pods (app traffic, redis-cli jobs, etc.)
        - podSelector: {}
        # Example: allow from app namespaces (edit to your env)
        - namespaceSelector:
            matchLabels:
              access.dragonflydb.io/allow: "true"
      ports:
        - port: 6379   # Redis
        - port: 6380   # TLS if you expose separately
  egress:
    - to:
        - podSelector: {}         # allow intra-namespace
        - namespaceSelector: {}   # allow kube DNS, etc. Narrow further in prod
      ports:
        - port: 53
          protocol: UDP
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0       # needed for S3; restrict to cloud endpoints if possible
      ports:
        - port: 443
          protocol: TCP
